safety = "Pipe form `curl .../get-helm-4 | bash` is offered only 'if you want to live on the edge'. RECOMMENDED flow downloads first so you can 'read through it and understand what it is doing before you run it'. FAQ openly discusses the trade-offs and wishes for better packaged releases."
