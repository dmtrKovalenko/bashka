category = "Offered but officially warns against blind pipe"
url = "https://get.docker.com"
command = "curl -fsSL https://get.docker.com -o install-docker.sh && sh install-docker.sh --dry-run && sudo sh install-docker.sh"
safety = "Convenience script EXISTS but the documented flow is download -> cat/inspect -> --dry-run -> sudo run. Explicitly 'not recommended for production'. Script guards against partial `curl | sh` downloads via a main() wrapper."

[tools.helm]
