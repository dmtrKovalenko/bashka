[package]
name = "bashka"
version = "0.3.0"
edition = "2024"

[dependencies]
annotate-snippets = "0.12.16"
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
console = "0.16.4"
dirs = "6.0.0"
indicatif = "0.18.6"
inventory = "0.3.24"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = "1.1.5"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
insta = "1.48.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
