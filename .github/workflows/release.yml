name: Release

# Every push to main becomes a release: the minor above the highest v* tag is chosen, binaries are built for
# Linux (glibc and musl), Android and macOS, install.sh and Formula/bashka.rb are pinned to their checksums, the bump is tagged
# `vX.Y.0`, the GitHub release goes out, then the bump lands on main and the crate is published. Pull requests only build and test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit
      - id: next
        # The next version is one minor above the highest v* tag on origin (Cargo.toml is only the
        # fallback for a repo without tags), so a rewritten or lagging main never wedges the pipeline.
        run: |
          latest="$(git ls-remote --tags origin 'refs/tags/v*' | sed -nE 's|.*refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            echo "latest tag on origin: v$latest"
            cargo set-version "$latest"
          fi
          cargo set-version --bump minor
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
          echo "next release: v$version"

  lint:
    name: Lint (fmt + clippy pedantic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux via cross-rs (Docker images with the right toolchains).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          # Android via cargo-ndk with the runner's preinstalled NDK (cross's stable Android image
          # ships an NDK too old for current Rust: its linker has no libunwind).
          - os: ubuntu-latest
            target: aarch64-linux-android
            android: true
          # macOS natively.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit
      - name: Set version
        run: cargo set-version "${{ needs.version.outputs.version }}"

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux' && !matrix.android
        with:
          tool: cross
      - name: Build (Linux, cross)
        if: runner.os == 'Linux' && !matrix.android
        run: cross build --release --target ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        if: matrix.android
        with:
          tool: cargo-ndk
      - name: Build (Android, cargo-ndk)
        if: matrix.android
        # The runner exports ANDROID_NDK_ROOT (NDK 27); cargo-ndk reads it directly.
        run: |
          echo "NDK: $ANDROID_NDK_ROOT"
          cargo ndk --target ${{ matrix.target }} --platform 24 build --release

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          MACOSX_DEPLOYMENT_TARGET=12 cargo build --release --target ${{ matrix.target }}
          codesign --force --sign - target/${{ matrix.target }}/release/bashka

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bashka dist/bashka-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bashka-${{ matrix.target }}
          path: dist/bashka-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Release ${{ needs.version.outputs.tag }}
    needs: [version, lint, test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: bashka-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd binaries
          for f in bashka-*; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit
      - name: Pin version and checksums
        run: |
          cargo set-version "${{ needs.version.outputs.version }}"
          make pin-installer VERSION="${{ needs.version.outputs.version }}" BINARIES_DIR=binaries
          bash -n install.sh
          ruby -c Formula/bashka.rb

      - name: Commit and tag
        # Re-running a failed job after the tag was pushed reuses the tag instead of committing
        # again, so a GitHub hiccup at upload or publish time is fixed by "Re-run failed jobs".
        run: |
          tag="${{ needs.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already on origin, releasing from it"
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git diff --quiet "$tag" -- Cargo.toml Cargo.lock install.sh Formula/bashka.rb \
              || { echo "pinned files differ from $tag; refusing to release"; exit 1; }
            git checkout -f "$tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock install.sh Formula/bashka.rb
          git commit -m "chore: release $tag [skip ci]"
          # Rebase first: commits pushed to main meanwhile must end up below the tag, not beside it.
          git pull --rebase origin main
          git tag -a "$tag" -m "bashka $tag"
          git push origin "$tag"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            binaries/*
            install.sh
          body: |
            ```sh
            curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/dmtrKovalenko/bashka/main/install.sh | bash
            ```
            `install.sh` on `main` is pinned to the checksums of these binaries. Already have bashka? `bashka update bashka`.
            Also: `brew install dmtrKovalenko/bashka/bashka`, `cargo install bashka`, `cargo binstall bashka`, `mise use -g github:dmtrKovalenko/bashka`.

      # Only now does main point install.sh at this release: it went public in the step above.
      - name: Push main
        run: git push origin HEAD:main

      # Trusted publishing: crates.io > bashka > Settings > Trusted Publishing must list this repo and
      # workflow file. The step runs last so a misconfiguration never blocks the GitHub release.
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          version="${{ needs.version.outputs.version }}"
          if curl -fsS -A "bashka-release (github actions)" "https://crates.io/api/v1/crates/bashka/$version" >/dev/null 2>&1; then
            echo "bashka $version is already on crates.io"
            exit 0
          fi
          cargo publish --locked
